---
layout: base
---
<header class="topnav">
  <div class="topnav__inner">
    <a class="topnav__logo" href="{{ '/' | relative_url }}">
      {% if site.logo %}<img src="{{ site.logo | relative_url }}" alt="" class="topnav__logo-icon">{% endif %}
      {{ site.title }}
    </a>
    <nav class="topnav__links" aria-label="Page links">
      <a href="{{ '/docs.html' | relative_url }}">Docs</a>
      <span class="soft">/</span>
      <a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>
</header>

<main id="main-content" tabindex="-1">
  {{ content }}
</main>
