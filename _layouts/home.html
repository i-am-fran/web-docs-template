---
layout: base
---
{% include mobile-header.html %}

<div class="shell">
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <aside class="sidebar" id="sidebar">
    {% include site-nav.html %}
    {% if page.sections %}
    <nav class="sidebar__nav" aria-label="On this page">
      <div class="sidebar__group">
        <span class="sidebar__group-label">Introduction</span>
        <ul class="sidebar__list">
          {% for section in page.sections %}
          <li><a class="sidebar__link" href="#{{ section.id }}" data-heading="{{ section.id }}">{{ section.label }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </nav>
    {% endif %}
  </aside>

  <main class="content" id="main-content" tabindex="-1">
    {{ content }}
  </main>
</div>
