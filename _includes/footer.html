<footer class="footer">
  <div>
    &copy; {{ site.time | date: '%Y' }} <span class="soft">/</span>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a> <span class="soft">/</span>
    <a href="{{ site.author_url }}" target="_blank" rel="noopener noreferrer">{{ site.author_label }}</a>
